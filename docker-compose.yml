services:
  # ── PostgreSQL Database ──────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: hala-postgres
    restart: unless-stopped
    # Publish the DB on loopback for local Prisma/Next.js access while
    # keeping it off public interfaces on the server.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5434}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-haladresses}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-haladresses}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hala-network

  # ── Database Init / Seed ─────────────────────────────────────
  init:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://hala-dresses.com}
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-Hala Dresses}
    container_name: hala-init
    restart: "no"
    entrypoint: ["./docker-init.sh"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-haladresses}?schema=public
      RUN_SEED: ${RUN_SEED:-false}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - hala-network

  # ── Next.js Application ──────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://hala-dresses.com}
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-Hala Dresses}
    container_name: hala-app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0

      # Database (internal Docker network – host is the `postgres` service)
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-haladresses}?schema=public

      # Public URLs (also baked at build time via the args above)
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://hala-dresses.com}
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-Hala Dresses}

      # The init service reads this before the app starts.
      RUN_SEED: ${RUN_SEED:-false}

      # ── nginx-proxy / letsencrypt-companion (reverse proxy) ──
      VIRTUAL_HOST: ${VIRTUAL_HOST:-hala-dresses.com}
      VIRTUAL_PORT: 3000
      LETSENCRYPT_HOST: ${LETSENCRYPT_HOST:-hala-dresses.com}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:-admin@hala-dresses.com}
    expose:
      - "3000"
    volumes:
      # Persist uploaded product images (written by /api/upload).
      - uploads-data:/app/public/images/products
      # Persist database + file backups created from the admin panel
      # (Settings → Backup) so they survive container restarts/redeploys.
      - backups-data:/app/backups
    depends_on:
      init:
        condition: service_completed_successfully
    networks:
      - hala-network
      - proxy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  hala-network:
    external: false
    name: hala-network
  # Shared external network created by the nginx-proxy stack.
  # Create it once on the server: `docker network create proxy`
  proxy:
    external: true
    name: proxy

volumes:
  postgres-data:
    driver: local
    name: hala-postgres-data
  uploads-data:
    driver: local
    name: hala-uploads-data
  backups-data:
    driver: local
    name: hala-backups-data
